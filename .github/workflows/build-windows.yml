name: Build Windows application
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single-file EXE
        run: dotnet publish AmanEdgeSmartBoard/AmanEdgeSmartBoard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AmanEdgeSmartBoard-Windows-x64
          path: publish/AmanEdgeSmartBoard.exe
          if-no-files-found: error
