name: Build Windows installer
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: dotnet publish AmanEdgeSmartBoard/AmanEdgeSmartBoard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "1.0.\${{ github.run_number }}"
          $iscc = "\${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "installer\AmanEdgeSmartBoard.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-output\*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer EXE was not generated." }
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List | Out-File installer-output\SHA256.txt
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AMAN-EDGE-SMARTBOARD-Setup-Windows-x64
          path: |
            installer-output/*.exe
            installer-output/SHA256.txt
          if-no-files-found: error
      - name: Upload portable application EXE
        uses: actions/upload-artifact@v4
        with:
          name: AMAN-EDGE-SMARTBOARD-Portable-Windows-x64
          path: publish/AmanEdgeSmartBoard.exe
          if-no-files-found: error
